name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          java-version: '8'
          distribution: 'temurin'
      - run: chmod +x gradlew
      - run: ./gradlew android:assembleDebug
      - uses: actions/upload-artifact@v3
        with:
          name: app-debug
          path: android/build/outputs/apk/debug/*.apk
